# Dependabot version updates. See:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
#
# No "uv" entry: pre-commit is installed into a local venv by the Makefile, not
# pinned by a manifest. Add one if this repo grows a pyproject.toml.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    # Wait 7 days after a release before opening a PR (lets bad releases get
    # yanked and matches uv's exclude-newer guidance).
    cooldown:
      default-days: 7

  # Bumps the `rev` pins in .pre-commit-config.yaml. Version updates only;
  # Dependabot does not provide security updates for this ecosystem.
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      all-hooks:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # The extension's own dependencies. Grouped so the dev toolchain (typescript,
  # eslint, webpack, mocha, prettier) lands as one PR a month instead of a dozen,
  # while runtime deps — antlr4 above all, which must stay in step with the
  # generated parser in src/_js_parser/ — stay separate and reviewable.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      dev-dependencies:
        dependency-type: "development"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
