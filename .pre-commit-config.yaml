# Copyright 2026 The Financial Risk Group, Inc.

# The ANTLR parser is regenerated from vor-stream's cmd/process/process.g4, so
# anything a hook fixes there is reverted on the next regeneration.
exclude: "^src/_js_parser/"

repos:
  - repo: https://github.com/google/addlicense
    rev: "v1.2.0"
    hooks:
      - id: addlicense
        args: [
            "-c",
            "The Financial Risk Group, Inc.",
            "-y",
            "2026",
            "-f",
            "copyright.gotmpl",
            "-ignore",
            ".github/workflows/claude*.yml",
            # Owned by release-please, which rewrites the file from scratch on
            # every release and would drop the header again.
            "-ignore",
            "CHANGELOG.md",
            # Generated from vor-stream's grammar; see the top-level exclude.
            "-ignore",
            "src/_js_parser/**",
          ]

  # A local hook rather than the mirrors-prettier rev pin, so formatting uses the
  # exact prettier in package.json and can't drift from `npm run format`.
  #
  # `language: system`, not `node`: a node-language hook makes pre-commit build
  # its own isolated environment, which it refuses to do for a local hook without
  # additional_dependencies — and pinning a version there is the drift this hook
  # exists to avoid. system runs the binary npm ci already installed.
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        language: system
        entry: node_modules/.bin/prettier
        args: ["--write"]
        types_or: [javascript, ts, json, markdown, yaml]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        # package-lock.json is over the 500 KB default by nature. Keep the guard
        # for everything else.
        exclude: "^package-lock\\.json$"
      - id: check-json
        # JSONC: comments are valid in these and the VS Code toolchain reads them
        # happily, but json.loads does not.
        exclude: "^(tsconfig\\.json|language-configuration\\.json|\\.vscode/)"
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
        args: [--unsafe]
      - id: end-of-file-fixer
        exclude: "^testdata/"
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace
        exclude: "^testdata/"

  # CHANGELOG.md is release-please's output, generated from commit messages, so
  # its formatting is not ours to fix.
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: "v0.23.2"
    hooks:
      - id: markdownlint-cli2
        exclude: "^CHANGELOG\\.md$"
        args: ["--config", ".markdownlint.json"]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Python dependencies are managed with uv, never pip or Poetry. These hooks
  # match only Python files and uv.lock / pyproject.toml / uv.toml, so they stay
  # inert until this repo grows Python of its own.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: "0.11.33"
    hooks:
      - id: uv-lock

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          [
            feat,
            fix,
            docs,
            style,
            refactor,
            test,
            build,
            ci,
            chore,
            revert,
            perf,
          ]
